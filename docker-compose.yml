services:
  mongodb:
    image: mongo:7.0
    container_name: educore-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - educore-network

  redis:
    image: redis:7-alpine
    container_name: educore-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - educore-network

  backend:
    image: ${ECR_REGISTRY}/educore-backend:${BACKEND_IMAGE_TAG:-latest}
    container_name: educore-backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: mongodb://mongodb:27017/educore_lms
      REDIS_DRIVER: redis
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: "true"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - educore-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:4000/health"
        ]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  frontend:
    image: ${ECR_REGISTRY}/educore-frontend:${FRONTEND_IMAGE_TAG:-latest}
    container_name: educore-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - educore-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:80/"
        ]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

networks:
  educore-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local

  redis_data:
    driver: local

  backend_uploads:
    driver: local