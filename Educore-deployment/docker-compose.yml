version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: educore-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: educore_lms
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - educore-network

  redis:
    image: redis:7-alpine
    container_name: educore-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - educore-network

  backend:
    build:
      context: ../educore-backend
      dockerfile: Dockerfile
    container_name: educore-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ../educore-backend/.env
    environment:
      - NODE_ENV=production
      - PORT=4000
      - MONGO_URI=mongodb://mongodb:27017/educore_lms
      - REDIS_DRIVER=redis
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGIN=http://localhost:3000
      - CLIENT_URL=http://localhost:3000
      - API_PUBLIC_URL=http://localhost:4000
      - COOKIE_SECURE=false
      - COOKIE_SAME_SITE=lax
      - TRUST_PROXY=true
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - educore-network

  frontend:
    build:
      context: ../educore-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000/api/v1
    container_name: educore-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - educore-network

networks:
  educore-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local
