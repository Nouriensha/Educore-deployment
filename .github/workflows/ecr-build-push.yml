name: Build and Push Docker Images

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: 265222804652.dkr.ecr.ap-south-1.amazonaws.com
  BACKEND_IMAGE: educore-backend
  FRONTEND_IMAGE: educore-frontend

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4

      - name: Checkout backend repository
        uses: actions/checkout@v4
        with:
          repository: Nouriensha/Educore-backend
          path: backend

      - name: Checkout frontend repository
        uses: actions/checkout@v4
        with:
          repository: Nouriensha/Educore-frontend
          path: frontend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

   

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image
        run: |
          docker build \
            -t $ECR_REGISTRY/$BACKEND_IMAGE:${GITHUB_SHA} \
            -t $ECR_REGISTRY/$BACKEND_IMAGE:latest \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_URL=/api/v1 \
            -t $ECR_REGISTRY/$FRONTEND_IMAGE:${GITHUB_SHA} \
            -t $ECR_REGISTRY/$FRONTEND_IMAGE:latest \
            ./frontend

      - name: Push backend image
        run: |
          docker push $ECR_REGISTRY/$BACKEND_IMAGE:${GITHUB_SHA}
          docker push $ECR_REGISTRY/$BACKEND_IMAGE:latest

      - name: Push frontend image
        run: |
          docker push $ECR_REGISTRY/$FRONTEND_IMAGE:${GITHUB_SHA}
          docker push $ECR_REGISTRY/$FRONTEND_IMAGE:latest

      - name: Deploy to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region $AWS_REGION \
            --instance-ids i-0660dbddedf736446 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "cd /home/ubuntu/apps/educore/deployment",
              "echo ========================================",
              "echo Starting EduCore deployment",
              "echo ========================================",
              "echo",
              "echo Recording currently running image versions...",
              "PREVIOUS_BACKEND_IMAGE=$(sudo docker inspect --format=\"{{.Config.Image}}\" educore-backend)",
              "PREVIOUS_FRONTEND_IMAGE=$(sudo docker inspect --format=\"{{.Config.Image}}\" educore-frontend)",
              "PREVIOUS_BACKEND_TAG=${PREVIOUS_BACKEND_IMAGE##*:}",
              "PREVIOUS_FRONTEND_TAG=${PREVIOUS_FRONTEND_IMAGE##*:}",
              "echo Previous backend: $PREVIOUS_BACKEND_TAG",
              "echo Previous frontend: $PREVIOUS_FRONTEND_TAG",
              "echo",
              "echo Logging in to Amazon ECR...",
              "aws ecr get-login-password --region ap-south-1 | sudo docker login --username AWS --password-stdin 265222804652.dkr.ecr.ap-south-1.amazonaws.com",
              "echo",
              "echo Pulling new application images...",
              "sudo BACKEND_IMAGE_TAG='${GITHUB_SHA}' FRONTEND_IMAGE_TAG='${GITHUB_SHA}' docker compose pull backend frontend",
              "echo",
              "echo Starting new application containers...",
              "sudo BACKEND_IMAGE_TAG='${GITHUB_SHA}' FRONTEND_IMAGE_TAG='${GITHUB_SHA}' docker compose up -d backend frontend",
              "echo",
              "echo Waiting for application containers...",
              "sleep 15",
              "echo",
              "echo Current container status:",
              "sudo docker compose ps",
              "echo",
              "echo Checking backend container health...",
              "BACKEND_HEALTH=$(sudo docker inspect --format=\"{{.State.Health.Status}}\" educore-backend)",
              "echo Backend container health: $BACKEND_HEALTH",
              "if [ \"$BACKEND_HEALTH\" != \"healthy\" ]; then echo \"Backend container is unhealthy\"; exit 1; fi",
              "echo",
              "echo Checking frontend container health...",
              "FRONTEND_HEALTH=$(sudo docker inspect --format=\"{{.State.Health.Status}}\" educore-frontend)",
              "echo Frontend container health: $FRONTEND_HEALTH",
              "if [ \"$FRONTEND_HEALTH\" != \"healthy\" ]; then echo \"Frontend container is unhealthy\"; exit 1; fi",
              "echo",
              "echo Checking backend API...",
              "sudo docker exec educore-backend wget -qO- http://127.0.0.1:4000/health",
              "echo",
              "echo Checking frontend HTTP response...",
              "sudo docker exec educore-frontend wget -qO- http://127.0.0.1:80/ >/dev/null",
              "echo Frontend HTTP check passed.",
              "echo",
              "echo ========================================",
              "echo Deployment health checks passed",
              "echo ========================================"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "Deployment Command ID: $COMMAND_ID"

          if aws ssm wait command-executed \
            --region $AWS_REGION \
            --command-id "$COMMAND_ID" \
            --instance-id i-0660dbddedf736446; then

            echo "Deployment command completed successfully."

          else

            echo "Deployment health checks failed."
            echo "Retrieving deployment failure details..."

            aws ssm get-command-invocation \
              --region $AWS_REGION \
              --command-id "$COMMAND_ID" \
              --instance-id i-0660dbddedf736446 \
              --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
              --output json

            exit 1
          fi

          aws ssm get-command-invocation \
            --region $AWS_REGION \
            --command-id "$COMMAND_ID" \
            --instance-id i-0660dbddedf736446 \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

      - name: Show pushed images
        run: |
          echo "Backend image:"
          echo "$ECR_REGISTRY/$BACKEND_IMAGE:${GITHUB_SHA}"

          echo "Frontend image:"
          echo "$ECR_REGISTRY/$FRONTEND_IMAGE:${GITHUB_SHA}"
