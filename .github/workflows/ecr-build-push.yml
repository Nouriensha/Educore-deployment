name: Build and Push Docker Images

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: 265222804652.dkr.ecr.ap-south-1.amazonaws.com
  BACKEND_IMAGE: educore-backend
  FRONTEND_IMAGE: educore-frontend

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4

      - name: Checkout backend repository
        uses: actions/checkout@v4
        with:
          repository: Nouriensha/Educore-backend
          path: backend

      - name: Checkout frontend repository
        uses: actions/checkout@v4
        with:
          repository: Nouriensha/Educore-frontend
          path: frontend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

   

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image
        run: |
          docker build \
            -t $ECR_REGISTRY/$BACKEND_IMAGE:${GITHUB_SHA} \
            -t $ECR_REGISTRY/$BACKEND_IMAGE:latest \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_URL=/api/v1 \
            -t $ECR_REGISTRY/$FRONTEND_IMAGE:${GITHUB_SHA} \
            -t $ECR_REGISTRY/$FRONTEND_IMAGE:latest \
            ./frontend

      - name: Push backend image
        run: |
          docker push $ECR_REGISTRY/$BACKEND_IMAGE:${GITHUB_SHA}
          docker push $ECR_REGISTRY/$BACKEND_IMAGE:latest

      - name: Push frontend image
        run: |
          docker push $ECR_REGISTRY/$FRONTEND_IMAGE:${GITHUB_SHA}
          docker push $ECR_REGISTRY/$FRONTEND_IMAGE:latest

      - name: Deploy to EC2
        run: |
          DEPLOY_SHA="${GITHUB_SHA}"

          REMOTE_SCRIPT=$(cat <<'REMOTE_SCRIPT'
          set -u

          cd /home/ubuntu/apps/educore/deployment

          echo "========================================"
          echo "EduCore Deployment"
          echo "========================================"
          echo

          PREVIOUS_BACKEND_IMAGE=$(sudo docker inspect --format="{{.Config.Image}}" educore-backend 2>/dev/null || true)
          PREVIOUS_FRONTEND_IMAGE=$(sudo docker inspect --format="{{.Config.Image}}" educore-frontend 2>/dev/null || true)

          PREVIOUS_BACKEND_TAG=${PREVIOUS_BACKEND_IMAGE##*:}
          PREVIOUS_FRONTEND_TAG=${PREVIOUS_FRONTEND_IMAGE##*:}

          echo "Previous backend: $PREVIOUS_BACKEND_TAG"
          echo "Previous frontend: $PREVIOUS_FRONTEND_TAG"
          echo "New deployment: __DEPLOY_SHA__"

          printf "BACKEND_IMAGE_TAG=%s\nFRONTEND_IMAGE_TAG=%s\n" \
            "$PREVIOUS_BACKEND_TAG" \
            "$PREVIOUS_FRONTEND_TAG" \
            | sudo tee .previous-images >/dev/null

          echo
          echo "Logging in to Amazon ECR..."

          aws ecr get-login-password \
            --region ap-south-1 \
            | sudo docker login \
              --username AWS \
              --password-stdin \
              265222804652.dkr.ecr.ap-south-1.amazonaws.com

          echo
          echo "Pulling new application images..."

          sudo BACKEND_IMAGE_TAG="__DEPLOY_SHA__" \
            FRONTEND_IMAGE_TAG="__DEPLOY_SHA__" \
            docker compose pull backend frontend

          echo
          echo "Starting new application containers..."

          sudo BACKEND_IMAGE_TAG="__DEPLOY_SHA__" \
            FRONTEND_IMAGE_TAG="__DEPLOY_SHA__" \
            docker compose up -d --no-deps backend frontend

          echo
          echo "Waiting for application containers..."
          sleep 15

          echo
          echo "Checking backend container..."

          BACKEND_HEALTH=$(sudo docker inspect \
            --format="{{.State.Health.Status}}" \
            educore-backend)

          echo "Backend health: $BACKEND_HEALTH"

          echo
          echo "Checking frontend container..."

          FRONTEND_HEALTH=$(sudo docker inspect \
            --format="{{.State.Health.Status}}" \
            educore-frontend)

          echo "Frontend health: $FRONTEND_HEALTH"

          echo
          echo "Checking backend API..."

          BACKEND_API=$(sudo docker exec \
            educore-backend \
            wget -qO- http://127.0.0.1:4000/health)

          echo "$BACKEND_API"

          echo

          if [ "$BACKEND_HEALTH" = "healthy" ] && \
             [ "$FRONTEND_HEALTH" = "healthy" ]; then

            echo "========================================"
            echo "Deployment health checks passed"
            echo "========================================"

            exit 0
          fi

          echo
          echo "========================================"
          echo "NEW DEPLOYMENT FAILED"
          echo "Starting automatic rollback"
          echo "========================================"

          if [ -z "$PREVIOUS_BACKEND_TAG" ] || \
             [ -z "$PREVIOUS_FRONTEND_TAG" ]; then

            echo "Previous image tags could not be determined."

            exit 1
          fi

          echo
          echo "Pulling previous application images..."

          sudo BACKEND_IMAGE_TAG="$PREVIOUS_BACKEND_TAG" \
            FRONTEND_IMAGE_TAG="$PREVIOUS_FRONTEND_TAG" \
            docker compose pull backend frontend

          echo
          echo "Restoring previous application..."

          sudo BACKEND_IMAGE_TAG="$PREVIOUS_BACKEND_TAG" \
            FRONTEND_IMAGE_TAG="$PREVIOUS_FRONTEND_TAG" \
            docker compose up -d --no-deps backend frontend

          echo
          echo "Waiting for rollback..."
          sleep 15

          ROLLBACK_BACKEND_HEALTH=$(sudo docker inspect \
            --format="{{.State.Health.Status}}" \
            educore-backend)

          ROLLBACK_FRONTEND_HEALTH=$(sudo docker inspect \
            --format="{{.State.Health.Status}}" \
            educore-frontend)

          echo "Rollback backend health: $ROLLBACK_BACKEND_HEALTH"
          echo "Rollback frontend health: $ROLLBACK_FRONTEND_HEALTH"

          if [ "$ROLLBACK_BACKEND_HEALTH" = "healthy" ] && \
             [ "$ROLLBACK_FRONTEND_HEALTH" = "healthy" ]; then

            echo "========================================"
            echo "Rollback successful"
            echo "Previous version restored"
            echo "========================================"

            exit 1
          fi

          echo "========================================"
          echo "CRITICAL: Rollback health checks failed"
          echo "========================================"

          exit 1
          REMOTE_SCRIPT
          )

          REMOTE_SCRIPT="${REMOTE_SCRIPT//__DEPLOY_SHA__/$DEPLOY_SHA}"

          COMMANDS_JSON=$(jq -Rn \
            --arg script "$REMOTE_SCRIPT" \
            '[$script]')

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids i-0660dbddedf736446 \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=$COMMANDS_JSON" \
            --query 'Command.CommandId' \
            --output text)

          echo "Deployment Command ID: $COMMAND_ID"

          if aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id i-0660dbddedf736446; then

            echo "Deployment completed successfully."

          else

            echo "Deployment command failed."

          fi

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id i-0660dbddedf736446 \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          COMMAND_STATUS=$(aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id i-0660dbddedf736446 \
            --query 'Status' \
            --output text)

          if [ "$COMMAND_STATUS" != "Success" ]; then
            exit 1
          fi
      - name: Show pushed images
        run: |
          echo "Backend image:"
          echo "$ECR_REGISTRY/$BACKEND_IMAGE:${GITHUB_SHA}"

          echo "Frontend image:"
          echo "$ECR_REGISTRY/$FRONTEND_IMAGE:${GITHUB_SHA}"
