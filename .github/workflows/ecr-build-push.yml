name: Build and Push Docker Images

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: 265222804652.dkr.ecr.ap-south-1.amazonaws.com
  BACKEND_IMAGE: educore-backend
  FRONTEND_IMAGE: educore-frontend

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4

      - name: Checkout backend repository
        uses: actions/checkout@v4
        with:
          repository: Nouriensha/Educore-backend
          path: backend

      - name: Checkout frontend repository
        uses: actions/checkout@v4
        with:
          repository: Nouriensha/Educore-frontend
          path: frontend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

   

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image
        run: |
          docker build \
            -t $ECR_REGISTRY/$BACKEND_IMAGE:${GITHUB_SHA} \
            -t $ECR_REGISTRY/$BACKEND_IMAGE:latest \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_URL=/api/v1 \
            -t $ECR_REGISTRY/$FRONTEND_IMAGE:${GITHUB_SHA} \
            -t $ECR_REGISTRY/$FRONTEND_IMAGE:latest \
            ./frontend

      - name: Push backend image
        run: |
          docker push $ECR_REGISTRY/$BACKEND_IMAGE:${GITHUB_SHA}
          docker push $ECR_REGISTRY/$BACKEND_IMAGE:latest

      - name: Push frontend image
        run: |
          docker push $ECR_REGISTRY/$FRONTEND_IMAGE:${GITHUB_SHA}
          docker push $ECR_REGISTRY/$FRONTEND_IMAGE:latest

      - name: Deploy to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region $AWS_REGION \
            --instance-ids i-0660dbddedf736446 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "cd /home/ubuntu/apps/educore/deployment",
              "echo Logging in to Amazon ECR...",
              "aws ecr get-login-password --region ap-south-1 | sudo docker login --username AWS --password-stdin 265222804652.dkr.ecr.ap-south-1.amazonaws.com",
              "echo Pulling new images...",
              "sudo BACKEND_IMAGE_TAG='${GITHUB_SHA}' FRONTEND_IMAGE_TAG='${GITHUB_SHA}' docker compose pull",
              "echo Starting updated containers...",
              "sudo BACKEND_IMAGE_TAG='${GITHUB_SHA}' FRONTEND_IMAGE_TAG='${GITHUB_SHA}' docker compose up -d",
              "echo Waiting for containers...",
              "sleep 15",
              "echo Container status:",
              "sudo docker compose ps",
              "echo Checking backend health...",
              "sudo docker exec educore-backend wget -qO- http://127.0.0.1:4000/health",
              "echo",
              "echo Checking frontend health...",
              "sudo docker exec educore-frontend wget -qO- http://127.0.0.1:80/",
              "echo",
              "echo Deployment completed successfully."
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "Deployment Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --region $AWS_REGION \
            --command-id "$COMMAND_ID" \
            --instance-id i-0660dbddedf736446

          aws ssm get-command-invocation \
            --region $AWS_REGION \
            --command-id "$COMMAND_ID" \
            --instance-id i-0660dbddedf736446 \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

      - name: Show pushed images
        run: |
          echo "Backend image:"
          echo "$ECR_REGISTRY/$BACKEND_IMAGE:${GITHUB_SHA}"

          echo "Frontend image:"
          echo "$ECR_REGISTRY/$FRONTEND_IMAGE:${GITHUB_SHA}"
