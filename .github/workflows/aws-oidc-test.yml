name: AWS OIDC Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-aws-oidc:
    runs-on: ubuntu-latest

    steps:
      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          token_request_token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          url += "&audience=sts.amazonaws.com"

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"bearer {token_request_token}"
              }
          )

          response = urllib.request.urlopen(request)
          data = json.load(response)

          token = data["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print("OIDC claims:")
          print(json.dumps({
              "sub": claims.get("sub"),
              "aud": claims.get("aud"),
              "repository": claims.get("repository"),
              "repository_owner": claims.get("repository_owner"),
              "repository_id": claims.get("repository_id"),
              "repository_owner_id": claims.get("repository_owner_id"),
              "ref": claims.get("ref"),
              "workflow_ref": claims.get("workflow_ref")
          }, indent=2))
          PY

      - name: Configure AWS credentials
        id: configure_aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Explain OIDC assume-role failures
        if: always() && steps.configure_aws.outcome != 'success'
        run: |
          echo "::warning::Could not assume role with OIDC. This repository uses immutable OIDC subject claims that include owner/repository IDs."
          echo "::warning::Update the AWS IAM trust policy for ${{ vars.AWS_ROLE_ARN }} to allow this subject format:"
          echo "::warning::repo:${{ github.repository_owner }}@${{ github.repository_owner_id }}/${{ github.event.repository.name }}@${{ github.repository_id }}:ref:${{ github.ref }}"

      - name: Verify AWS identity
        if: steps.configure_aws.outcome == 'success'
        run: |
          aws sts get-caller-identity
